name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "AgentControl-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AgentControl-apk
          path: android/AgentControl-${{ github.run_number }}.apk
          retention-days: 30
