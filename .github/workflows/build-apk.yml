name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

# Read-only: this workflow can't change the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Fingerprint of the one permanent signing key. Every APK must match it,
      # so updates always install over the old version and keep your saved keys.
      EXPECTED_CERT_SHA256: 6ac2f9ce27838bccdb632db9ec150c16a3a56b3c81792a95668843569e490883
    steps:
      # Actions are pinned to exact commits (the v4 tags as of Nov 2026),
      # so a hijacked tag can't swap in different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the build if gradle-wrapper.jar isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run tests (contract, security, and every screen on a simulated phone)
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          retention-days: 7

      # The signing password is given ONLY to the two steps that need it, never to
      # the test step (which runs third-party test libraries).
      - name: Check the signing password secret is set
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Tests passed. To build the APK, add the repo secret ANDROID_SIGNING_PASSWORD (see README, 'One-time setup for updates')."
            exit 1
          fi

      - name: Build the release APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the APK is not debuggable
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release.apk | grep -q 'debuggable.*=true'; then
            echo "::error::APK is debuggable"; exit 1
          fi

      - name: Check the APK is signed with the permanent key
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          WANT=$(echo "$EXPECTED_CERT_SHA256" | tr -d ' ')
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK signed with the wrong key ($GOT)"; exit 1; fi
          echo "Signed with the permanent key."

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "AgentControl-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentControl-apk
          path: android/AgentControl-${{ github.run_number }}.apk
          retention-days: 30
