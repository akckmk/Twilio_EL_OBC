name: Deploy backend

# Runs only when you press "Run workflow" on the Actions tab.
# It only READS after deploying (health, agents, live calls, usage). It never ends calls.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AGENT_CONTROL_KEY: ${{ secrets.AGENT_CONTROL_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check that all four secrets are set
        run: |
          missing=0
          for name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN ELEVENLABS_API_KEY AGENT_CONTROL_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Repo secret $name is missing"; missing=1; fi
          done
          if [ ${#AGENT_CONTROL_KEY} -lt 32 ]; then
            echo "::error::AGENT_CONTROL_KEY must be at least 32 characters"; missing=1
          fi
          exit $missing

      - name: Run tests
        run: npm test

      - name: Install the Twilio CLI
        run: |
          npm install -g twilio-cli@7.3.0
          twilio plugins:install @twilio-labs/plugin-serverless@5.0.0

      - name: Find or create the Sync store (remembers call matches and calls you ended)
        run: |
          SID=$(twilio api:sync:v1:services:list -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(v=>v.friendlyName==="agentcontrol");console.log(x?x.sid:"")})')
          if [ -z "$SID" ]; then
            SID=$(twilio api:sync:v1:services:create --friendly-name agentcontrol -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].sid))')
          fi
          echo "SYNC_SERVICE_SID=$SID" >> "$GITHUB_ENV"

      - name: Deploy to Twilio Serverless
        run: |
          umask 077
          printf 'ELEVENLABS_API_KEY=%s\nAGENT_CONTROL_KEY=%s\nSYNC_SERVICE_SID=%s\n' "$ELEVENLABS_API_KEY" "$AGENT_CONTROL_KEY" "$SYNC_SERVICE_SID" > .env
          twilio serverless:deploy \
            --service-name agentcontrol \
            --runtime node24 \
            --production \
            --override-existing-project \
            --force \
            --output-format json > deploy.json
          rm -f .env
          DOMAIN=$(node -e 'const t=require("fs").readFileSync("deploy.json","utf8"); const m=t.match(/"domain":\s*"([^"]+)"/); if(!m) process.exit(1); console.log(m[1])')
          echo "BASE_URL=https://$DOMAIN" >> "$GITHUB_ENV"

      - name: Check the deployment (read-only)
        run: |
          {
            echo "## Agent Control backend"
            echo ""
            echo "Backend URL (type this into the app): **$BASE_URL**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          ok=1
          # Only counts and messages go into the summary, never numbers or transcripts.
          for route in health agents live usage; do
            code=$(curl -sS -o out.json -w '%{http_code}' -H "X-Agent-Control-Key: $AGENT_CONTROL_KEY" "$BASE_URL/$route" || echo 000)
            summary=$(node -e '
              const r=process.argv[1]; let b={}; try{b=JSON.parse(require("fs").readFileSync("out.json","utf8"))}catch(e){}
              const lines=[b.message||""];
              if(r==="health") for(const c of b.checks||[]) lines.push(`- ${c.ok?"✅":"❌"} ${c.name}${c.ok?"":` (needs ${c.needs})`}`);
              if(r==="agents") lines.push(`${(b.agents||[]).length} agents: ${(b.agents||[]).map(a=>a.name).join(", ")}`);
              if(r==="live") lines.push(`${(b.calls||[]).length} live call(s) right now`);
              if(r==="usage"&&b.elevenlabs) lines.push(`ElevenLabs credits left: ${b.elevenlabs.creditsLeft??b.elevenlabs.error}`);
              console.log(lines.filter(Boolean).join("\n"));' "$route")
            echo "/$route -> HTTP $code"; echo "$summary"
            printf '### /%s (HTTP %s)\n%s\n\n' "$route" "$code" "$summary" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || ok=0
            if [ "$route" = health ] && ! node -e 'process.exit(JSON.parse(require("fs").readFileSync("out.json","utf8")).ok?0:1)'; then
              echo "::warning::Setup is incomplete: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("out.json","utf8")).message)')"
            fi
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/agents" || echo 000)
          echo "### /agents without the key: HTTP $code (should be 401)" >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "401" ] || ok=0
          rm -f out.json
          [ $ok = 1 ]
